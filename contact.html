<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TINTX Pakistan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    .contact-section { padding: 60px 20px; background: #f8f8f8; }
    .contact-container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    .contact-title { color: #000; font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; }
    .contact-subtitle { color: #FFC107; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 30px; }
    .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
    .form-group { flex: 1; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 0.9rem; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Poppins'; font-size: 1rem; }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .btn-submit { background: #FFC107; color: #000; padding: 14px 40px; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .btn-submit:hover { background: #e6ac00; }
    @media(max-width: 768px){ .form-row { flex-direction: column; gap: 0; }
    </style>
</head>
<body>

<header style="background:#000; padding:15px 20px; display:flex; justify-content:space-between; align-items:center;">
  <div><a href="index.html" style="color:white; text-decoration:none; font-weight:700;">☰ MENU</a></div>
  <div><img src="logo-new.png" alt="TINTX" style="height:40px;"></div>
  <a href="https://wa.me/923112205795" style="background:#FFC107; color:#000; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:700;">Order Now</a>
</header>

<section class="contact-section">
  <div class="contact-container">
    <p class="contact-subtitle">INFORMATION ABOUT US</p>
    <h2 class="contact-title">CONTACT US FOR ANY QUESTIONS</h2>
    
    <form action="https://wa.me/923112205795" method="get" onsubmit="sendToWhatsApp(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Your Email</label>
          <input type="email" id="email" required>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
          <label>Car Model</label>
          <input type="text" id="company" placeholder="e.g. Honda Civic 2020">
        </div>
      </div>
      
      <div class="form-group">
        <label>Your Message</label>
        <textarea id="message" placeholder="Write your question here..." required></textarea>
      </div>
      
      <button type="submit" class="btn-submit">SEND ON WHATSAPP</button>
    </form>
  </div>
</section>

<footer style="background:#000; color:#fff; text-align:center; padding:20px;">
  <p>Copyright © 2026 TINTX Pakistan</p>
</footer>

<script>
function sendToWhatsApp(e) {
  e.preventDefault();
  let name = document.getElementById('name').value;
  let email = document.getElementById('email').value;
  let phone = document.getElementById('phone').value;
  let car = document.getElementById('company').value;
  let msg = document.getElementById('message').value;
  
  let text = `Hi TINTX, New Contact Form Submission:%0A%0AName: ${name}%0AEmail: ${email}%0APhone: ${phone}%0ACar: ${car}%0AMessage: ${msg}`;
  
  window.open(`https://wa.me/923112205795?text=${text}`, '_blank');
}
</script>

</body>
</html>
