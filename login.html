<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - TINTX</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .box { background:white; padding:40px; border-radius:10px; box-shadow:0 5px 20px rgba(0,0,0,0.2); width:350px; }
    .box h2 { text-align:center; color:#FFC107; margin-bottom:20px; }
    input { width:100%; padding:12px; margin:10px 0; border:2px solid #ddd; border-radius:5px; box-sizing:border-box; }
    button { width:100%; padding:12px; background:#000; color:#FFC107; border:none; border-radius:5px; font-weight:700; font-size:16px; cursor:pointer; }
    button:hover { background:#333; }
    .switch { text-align:center; margin-top:15px; }
    .switch a { color:#FFC107; text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="box">
    <h2>LOGIN / REGISTER</h2>
    <input type="text" placeholder="Name" id="name">
    <input type="tel" placeholder="WhatsApp Number" id="phone">
    <input type="text" placeholder="Car Model" id="car">
    <button onclick="sendToWhatsApp()">ORDER ON WHATSAPP</button>
    
    <div class="switch">
      <p>Direct Order? <a href="https://wa.me/923112205795">Click Here</a></p>
    </div>
  </div>

<script>
function sendToWhatsApp() {
  let name = document.getElementById('name').value;
  let phone = document.getElementById('phone').value;
  let car = document.getElementById('car').value;
  
  let message = `New Order from TINTX Website:%0AName: ${name}%0APhone: ${phone}%0ACar: ${car}`;
  window.open(`https://wa.me/923112205795?text=${message}`, '_blank');
}
</script>
</body>
</html>
